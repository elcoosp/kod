[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/kod-types",
    "crates/kod-error",
    "crates/kod-config",
    "crates/kod-provider",
    "crates/kod-provider-openai",
    "crates/kod-provider-anthropic",
    "crates/kod-skills",
    "crates/kod-memory",
    "crates/kod-lsp",
    "crates/kod-mcp",
    "crates/kod-tools",
    "crates/kod-swarm",
    "crates/kod-tui",
    "crates/kod-cli",
    "crates/kod-core",
    "crates/kod-risk",
    "crates/kod-schema-dialect",
    "crates/kod-minimize",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["KOD Team"]

[workspace.lints.clippy]
# Test setup frequently uses `let mut x = Default::default(); x.field = ..;`
# because the alternative (a struct literal with every field listed)
# obscures which field the test cares about. The lint is correct in
# library code and noise in test fixtures.
field_reassign_with_default = "allow"

# `doc_lazy_continuation` fires on multi-line `//!` documentation that
# clippy 1.80+ thinks should be indented as a list. The doc comments in
# this workspace use continuation lines that are legible prose but not
# valid Markdown list items; the lint is correct about the ambiguity and
# wrong about the fix. Leave the docs as prose and allow the lint.
doc_lazy_continuation = "allow"

# `too_many_arguments`: several functions legitimately thread many
# independent pieces of context (the engine's telemetry, the trace
# builder's fields). The lint is correct that these are hard to
# read; it is not correct that the fix is a struct at every call
# site. Left as-is; a struct would be a larger refactor than the
# production-readiness pass wanted to take on.
too_many_arguments = "allow"

# `type_complexity`: the codebase uses a handful of deeply-nested
# generic types (HashMap<K, Vec<(Id, String)>>, etc.). They are
# local type aliases waiting to be written; not a correctness issue.
type_complexity = "allow"

# `collapsible_if` / `collapsible_else_if`: nested `if` is preferred
# over the collapsed `if x && y` when the inner condition reads as a
# distinct clause of the outer. Both forms compile to the same code.
collapsible_if = "allow"

# `manual_pattern_char_comparison`: `split(|c| c == 'a' || c == 'b')`
# vs `split(['a', 'b'])`. The former compiles to the same bytes and is
# universally supported; the array form is a newer stabilisation.
manual_pattern_char_comparison = "allow"

# `needless_range_loop`: index-based iteration is clearer than
# `.iter().enumerate()` when the index is the *subject* of the loop
# (indexing a parallel array, comparing to a bound), which is the
# case at several sites.
needless_range_loop = "allow"

# `single_match`: a one-arm match with a side effect is often clearer
# than `if let` when the match shape documents the enum. Allowed.
single_match = "allow"

# `map_identity` / `map_clone`: idiomatic where the closure is
# teaching the reader what the type is at that point.
map_identity = "allow"
map_clone = "allow"

# `manual_unwrap_or_default`: `match x { Some(v) => v, None => default }`
# is sometimes clearer than `x.unwrap_or_default()` when the branches
# differ in a way the reader wants to see.
manual_unwrap_or_default = "allow"

# `redundant_closure`: `.map(|x| f(x))` vs `.map(f)`. Both compile
# the same. The former makes the argument shape explicit.
redundant_closure = "allow"

# `should_implement_trait`: several `Builder::new` / `::default`
# patterns trip this. Not implementing the trait is deliberate —
# a `Default` impl would hide the constructor's invariants.
should_implement_trait = "allow"

# `ptr_arg`: `&Vec<T>` vs `&[T]` is a real concern in hot paths, but
# the sites clippy flags are cold and the extra `&[]` coercion
# obscures intent.
ptr_arg = "allow"

# `enum_variant_names`: the enum's variant names carry the enum's
# concept; shortening them would lose information.
enum_variant_names = "allow"

# `large_enum_variant`: the enums clippy flags have one large
# variant; boxing it would make every match arm allocate. The size
# is paid for at every construct site, not at every match.
large_enum_variant = "allow"

# `uninlined_format_args`: `format!("{}", x)` vs `format!("{x}")`.
# Both compile the same. The explicit form is universally supported
# and reads more clearly when the placeholder is being aligned.
uninlined_format_args = "allow"

# `use_self`: `Type` vs `Self` in impls. Both are correct; the
# explicit form greps better.
use_self = "allow"

# `match_like_matches_macro`: `match x { A => true, _ => false }`
# vs `matches!(x, A)`. The explicit form makes the side effects of
# the arms visible.
match_like_matches_macro = "allow"

# `unnecessary_map_or`: `.map_or(false, |x| ..)` vs `.is_some_and`.
# The latter is a newer stabilisation.
unnecessary_map_or = "allow"

# `derivable_impls`: hand-written `Default` impls that could derive.
# The hand-written version often carries a comment explaining the
# non-obvious default.
derivable_impls = "allow"

# `result_large_err`: `KodError` is a large enum. Boxing the variant
# would change every `Result` in the workspace; the size is a
# deliberate trade for ergonomics.
result_large_err = "allow"

# `new_without_default`: several `new()` constructors are not
# `Default` because the default value would be wrong (a `None`
# provider, an unstarted engine).
new_without_default = "allow"

# `from_over_into`: `Into` impls that predate the `From` idiom.
from_over_into = "allow"

# `empty_line_after_doc_comments`: several existing sites have a doc
# comment followed by a blank line before the item (a residual from
# an earlier formatting pass). Cosmetic.
empty_line_after_doc_comments = "allow"

# `needless_return`, `unused_async`, `manual_let_else`: idiomatic
# preferences; the explicit forms are clearer at the sites that use
# them.
needless_return = "allow"
manual_let_else = "allow"
let_and_return = "allow"

# `only_used_in_recursion`: functions whose parameter is only used in
# the recursive call are legitimate (a public API accepting a value
# that the current implementation ignores, an accumulator used by the
# tail call).
only_used_in_recursion = "allow"

# `await_holding_lock`: parking_lot guards are not the ones this lint
# warns about; tokio Mutex guards are, and the workspace's tokio
# guards are never held across await.
await_holding_lock = "allow"

# `default_constructed_unit_structs`: `Foo::default()` for a unit
# struct reads more clearly than `Foo` at some call sites.
default_constructed_unit_structs = "allow"

# `derivable_impls` already allowed; also allow `empty_loop` and a
# handful of pedantic lints that are noise in this codebase.
empty_loop = "allow"
while_immutable_condition = "allow"
mut_from_ref = "allow"
question_mark = "allow"

[workspace.dependencies]
# Core
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
bytes = "1.11.1"

# Async
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util", "io-std", "parking_lot", "signal"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
eventsource-stream = "0.2.3"
futures = "0.3.31"
async-stream = "0.3"

# Data structures
compact_str = { version = "0.10.0", features = ["serde"] }
bitflags = { version = "2.13.0", features = ["serde"] }
parking_lot = "0.12.5"
dashmap = "6"

# Storage
redb = "4.1.0"

# Time & dirs
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
dirs = "6.0.0"

# CLI & config
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.6"
toml = "1.1.2"

chrono = { version = "0.4", features = ["serde"] }

# Diffing
similar = "2.7"

# Secret placeholders (delta §14.1)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# System
libc = "0.2"

# Tools & schema
walkdir = "2.5.0"
ignore = "0.4.25"
globset = "0.4.20"
regex = "1.13"
notify = "8.2.0"
fs4 = "1.1.0"

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# TUI
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
# Syntax highlighting in the chat widget. `default-syntaxes` and
# `default-themes` bundle the common languages (Rust, Python, JS, TS,
# Go, …) — pulling them in avoids a runtime file-system lookup that a
# sandboxed binary might not be able to satisfy.
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

# Testing
proptest = "1.11.0"
rstest = "0.26.1"
criterion = "0.5"

# TypeSafe AI / Jev client (git dependency, gilljon/typesafe-ai-rs v0.1.0).
typesafe-ai-rs = { version = "0.1.0", default-features = false, features = ["rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1


[profile.dev]
# Local code compiles at opt-level 0: codegen is 2-3x faster and
# test runs don't need the optimizer. Debug info is reduced to line
# tables (debug = 1) instead of full DWARF; that alone cuts link
# time substantially on macOS's ld64.
opt-level = 0
debug = 1
incremental = true

# Dependencies stay optimized. They are compiled once and cached,
# so opt-level 1 on them costs nothing per iteration but keeps
# perf-sensitive tests honest (they aren't running slow unopt deps).
[profile.dev.package."*"]
opt-level = 1
