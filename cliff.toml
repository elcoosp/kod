# git-cliff configuration for KOD's CHANGELOG.md
#
# Regenerates the file in the exact format the D1 recovery established:
# - "## [X.Y.Z] - YYYY-MM-DD" headers (oldest first within a release)
# - Per-category subsections: Security / Features / Fixes / Performance /
#   Refactor / Dependencies / Documentation / Other
# - Bullets in the form "- **scope:** message (short-sha)"
#
# The v0.1.0-v0.1.2 entries were hand-curated before this config existed.
# The workflow preserves them by only replacing content from v0.1.3 forward
# (see .github/workflows/changelog.yml).
#
# To regenerate locally: `git-cliff --tag vX.Y.Z --output /tmp/new.md`
# To regenerate only the tail (v0.1.3+): see workflow.

[changelog]
header = """
# Changelog

All notable changes to KOD are documented here.

Format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Releases from v0.1.3 onward are generated from conventional commits by
[git-cliff](https://git-cliff.org). v0.1.0 through v0.1.2 are hand-curated.
"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat",                    group = "Features" },
    { message = "^fix",                     group = "Fixes" },
    { message = "^perf",                    group = "Performance" },
    { message = "^refactor",                group = "Refactor" },
    { message = "^security",                group = "Security" },
    { message = "^deps|^chore\\(deps\\)",   group = "Dependencies" },
    { message = "^docs",                    group = "Documentation" },
    { message = "^chore\\(release\\)",      skip = true },
    { message = "^release:",                skip = true },
    { message = "^revert",                  group = "Other" },
    { message = ".*",                       group = "Other" },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
protect_breaking_commits = false
