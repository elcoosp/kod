# Nextest configuration.
#
# The kod-tui clipboard tests all share the system pasteboard
# (pbcopy / pbpaste on macOS, xclip / xsel / wl-paste on Linux).
# Nextest runs each test in its own process and, by default, many of
# them in parallel, so two clipboard tests can interleave a write and
# a read: the round-trip test writes its unique payload, another test
# overwrites the pasteboard with "" or a unicode string, and the
# subsequent read sees the wrong content.
#
# Put every test whose name contains "clipboard" into a single-thread
# test group. That removes the cross-process race without changing
# production code and without weakening the round-trip assertion.

[test-groups.clipboard]
max-threads = 1

# Git's background auto-maintenance is disabled per-repo, not here.
#
# `git commit` and `git worktree add` fork `gc --auto` (and, on newer
# git, a `maintenance` child) as a detached process. A test waits on
# the *direct* git child, so the grandchild outlives it and nextest
# flags the test LEAK. Under parallel load the gc threshold is crossed
# more often, which is why the flag was intermittent — and why a
# subprocess-free test could inherit the flag when a sibling binary's
# stray git process was still alive at nextest's check.
#
# The fix lives in the test helpers that create a git repo: each runs
# `git config gc.auto 0` (and `gc.autoDetach false`,
# `maintenance.auto false`) on the repo it makes. Every leak-prone
# spawn is inside such a repo — the only `commit` calls in the test
# tree are in `git_tools.rs`, `minimizer_integration.rs`, and
# `worktree.rs`, all of which set those keys.
#
# This file carried a `[profile.default] env = { GIT_CONFIG_* }` block
# intended to cover every git subprocess at once. nextest 0.9 has no
# config `env` key — it was silently ignored and produced a warning —
# so that layer never applied. It is removed rather than reimplemented
# via the experimental `setup-scripts` feature: the per-repo layer
# covers the actual spawns, and a dead config block that claims
# coverage is worse than none.

[[profile.default.overrides]]
filter = 'test(/clipboard/)'
test-group = 'clipboard'

# Per-test timeout. A single test hung for six hours on the Linux CI
# runner (a landlock `apply` test that blocks after restricting the
# process), consuming the whole job. nextest terminates a test that
# exceeds `terminate-after` periods, so one bad test costs seconds,
# not the job.
[[profile.default.overrides]]
filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 5 }

# Added for #3: subprocess-spawning tests serialized to avoid
# process-table contention under full-workspace parallelism.
#
# Set generated by walking every `crates/*/tests/` for files whose
# source contains `Command::new` / `process::Command` AND a test
# attribute (`#[test`, `#[tokio::test`, or `#[rstest` — prefix match
# so `#[tokio::test(flavor = "...")]` counts). Helper files named
# `mod`/`common`/`harness`/`fixture`/`support`/`util` are excluded
# so the pattern does not pick up unrelated tests by substring.
#
# `auto_check` is included manually: `auto_check_tests` spawns `cargo
# check` transitively via `kod_tools::check::run_check`, so the walker
# (which greps for direct `Command::new` in test files) does not see
# it. The same holds for any test that reaches `execute_command`
# through `run_tool_calls` without a direct `Command::new`. Add those
# by hand as they appear — the walker is not exhaustive for indirect
# spawners.

[test-groups]
serial-subprocess = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/(acp_handshake|background_shell|config_migrate|dispatch_arms|git_tools|malformed_rpc|mcp_roundtrip|memory_residual|metrics|minimizer_integration|policy_explain|replay|run_chat_wrapper|sandbox_containment|auto_check)/)'
test-group = 'serial-subprocess'
