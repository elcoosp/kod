# Build configuration.
#
# target-cpu=native was removed from the default build config. It caused
# CI release binaries to require the exact CPU features of the GitHub
# Actions runner, producing SIGILL on older CPUs when users ran them.
#
# For local native builds use:  cargo build --release -C target-cpu=native
# (or the `just build-native` recipe).

# kache is a rustc-wrapper build cache. It is a good local tool.
#
# It used to be set here under `[build]` as `rustc-wrapper = "kache"`,
# which forced the coupling on every clean checkout — including
# GitHub Actions runners, where kache is not installed. The v0.1.13
# release workflow failed on all six targets because of it:
#
#     error: could not execute process `kache .../rustc -vV`
#     Caused by: No such file or directory (os error 2)
#
# Local tool choices live in the user-level config, not the repo.
# To use kache locally, add to `~/.cargo/config.toml`:
#
#     [build]
#     rustc-wrapper = "kache"
#
# (or export `RUSTC_WRAPPER=kache` in the shell — the release and CI
# workflows set `RUSTC_WRAPPER: ""` so a runner-side value cannot
# affect a project build either way).
#
# If the tracked wrapper is ever re-added, the release workflow must
# install kache on every target. Removing the `RUSTC_WRAPPER: ""`
# guard without installing kache is the shape that broke v0.1.13.

# target-cpu=native was removed from the default build config: it
# caused CI release binaries to require the exact CPU features of
# the runner, producing SIGILL on older CPUs. For local native
# builds, use `cargo build --release -C target-cpu=native` (or the
# `just build-native` recipe).
