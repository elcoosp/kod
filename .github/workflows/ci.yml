name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# H-C6: cancel a superseded run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # H-C6: RUSTFLAGS is scoped to the lint job below. Setting it
  # workflow-wide broke CI on a warning emitted by any *dependency*
  # (a nightly change in a transitive crate is out of our control)
  # and forced a from-scratch rebuild of every `cargo install`ed
  # tool (audit, deny, tarpaulin, bloat).

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      env:
        RUSTFLAGS: "-D warnings"
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Run tests
      run: cargo test --workspace --locked

    - name: Run doc tests
      run: cargo test --doc --workspace --locked

  # Fast, deterministic, offline — the two suites that guard the two
  # invariants a refactor is most likely to break silently:
  #
  # - **Provider contracts** (`kod-provider-openai`, `kod-provider-
  #   anthropic`): the wire shape each provider emits for `complete`
  #   and `stream_completion`. The tests use `httpmock` (no network)
  #   and pin multi-role messages, tool calls with ids, tool results
  #   linked by `tool_call_id`, `cache_control` placement on the last
  #   cacheable segment, and `input_schema` vs `parameters`.
  #
  # - **Prompt goldens** (`kod-core`): the byte-level shape of the
  #   prompt the router emits (`characterization_prompts`), the
  #   cacheable prefix's stability across turns (`golden_prefix`), the
  #   `PromptPlan` identity with the text builder (`prompt_plan`), and
  #   the historical transcript rendering (`characterization_history`).
  #
  # Splitting these out of the main `test` job does not remove them
  # from that job; it makes the failure domain legible in the CI UI,
  # which is what §11.4 asks for.
  contracts:
    name: Provider contracts + prompt goldens
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-contracts-
          ${{ runner.os }}-cargo-

    - name: Provider request-shape contracts
      run: |
        cargo test -p kod-provider-openai --test contracts
        cargo test -p kod-provider-anthropic --test contracts

    - name: Prompt characterization + golden prefix + plan
      run: |
        cargo test -p kod-core --test characterization_history
        cargo test -p kod-core --test characterization_prompts
        cargo test -p kod-core --test golden_prefix
        cargo test -p kod-core --test prompt_plan

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deny
      run: cargo install cargo-deny

    - name: Run cargo-deny
      run: cargo deny check

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin

    - name: Run coverage
      run: cargo tarpaulin --workspace --out Xml --output-dir coverage

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: coverage/cobertura.xml
        flags: unittests
        name: codecov-umbrella

  # PR-level size gate. The release workflow has a strict 15 MB ceiling
  # on the musl release binary; this lighter check runs on every PR
  # against the debug binary (which is much larger — the point is to
  # catch a runaway dependency add, not to enforce the release
  # promise). A +50 % jump in the debug binary size on a PR is a signal
  # to look at what the diff pulled in; the ceiling leaves room for
  # legitimate growth while catching the pathological case.
  bloat-pr:
    name: Size gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-bloat-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-bloat-

    - name: Build debug binary
      run: cargo build -p kod-cli

    - name: Enforce debug-size ceiling
      run: |
        set -euo pipefail
        BIN=target/debug/kod
        SIZE=$(stat -c%s "$BIN")
        # 200 MiB ceiling. The release binary strips symbols and
        # optimises; debug keeps them. The gate is intentionally
        # generous — the point is to catch a jump, not to police the
        # exact debug size.
        MAX=$((200 * 1024 * 1024))
        echo "debug binary size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MiB)"
        if [ "$SIZE" -gt "$MAX" ]; then
          echo "debug binary exceeds the 200 MiB PR ceiling" >&2
          echo "the diff likely pulled in a heavy dependency; run" >&2
          echo "  cargo bloat -p kod-cli --crates --n 20" >&2
          echo "to see the largest contributors" >&2
          exit 1
        fi

  # Runs the #[ignore]-gated tests that exercise the product against a
  # real OpenAI-compatible server. Without this job, the ignored tests
  # never execute anywhere and a regression in the streaming loop,
  # tool-call assembly, or list_models ships without a signal.
  #
  # Uses the smallest reliable Ollama model (qwen2.5:0.5b, ~350 MB) so
  # pull time stays under a minute on a warm cache. The Ollama setup is
  # the standard installer rather than a marketplace action: the
  # installer is stable, and the actions in that space have had flaky
  # releases.
  live-model:
    name: Live model (Ollama)
    runs-on: ubuntu-latest
    # Skip on PRs from forks that can't install services; run on every
    # push to main/develop and on PRs from the same repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-live-

    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama --version

    - name: Start Ollama
      run: |
        # The systemd unit the installer ships does not run in the
        # Actions sandbox, so start the server directly and wait for
        # /api/tags to answer.
        nohup ollama serve > /tmp/ollama.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf http://localhost:11434/api/tags > /dev/null; then
            echo "Ollama is up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "Ollama did not start within 30s; log follows:" >&2
        cat /tmp/ollama.log >&2
        exit 1

    - name: Pull tiny model
      run: ollama pull qwen2.5:0.5b

    - name: Run live provider tests
      env:
        KOD_TEST_MODEL: qwen2.5:0.5b
      run: cargo test -p kod-provider-openai -- --ignored --nocapture

    - name: Run live TUI round-trip test
      env:
        KOD_TEST_MODEL: qwen2.5:0.5b
        KOD_TEST_DB: /tmp/kod-test.redb
      run: |
        # The TUI's live test needs a kod config pointing at localhost.
        # Write a minimal one into the config directory the CLI reads.
        mkdir -p "$HOME/.config/kod"
        cat > "$HOME/.config/kod/config.toml" <<'CFG'
        [llm]
        provider = "OpenAICompatible"
        model = "qwen2.5:0.5b"
        base_url = "http://localhost:11434"
        context_window = 8192
        max_tokens = 512
        temperature = 0.2
        timeout_secs = 120
        CFG
        # NOTE: the previous --test main_loop target does not exist
        # (all TUI tests are inline #[cfg(test)] modules). Run every
        # ignored test in the crate instead.
        cargo test -p kod-tui -- --ignored --nocapture

  # Live Anthropic API tests (design §4 D1.5). Runs only when the
  # `ANTHROPIC_API_KEY` repository secret is set — a PR from a fork
  # does not have it, so the job is skipped rather than failing. This
  # is the design's "skip, do not fail" shape. Every test in
  # `crates/kod-provider-anthropic/tests/live.rs` re-checks the
  # variable and returns cleanly when it is absent, so the skip is
  # enforced twice: at the job level and at the test level.
  live-anthropic:
    name: Live Anthropic (skippable)
    runs-on: ubuntu-latest
    # H-C5: `secrets` is not available in a job-level `if:`. The
    # pre-fix condition always evaluated false and the job never ran.
    # Gate on the *event* here (push and same-repo PRs only) and let
    # the test itself re-check `ANTHROPIC_API_KEY` — every test in
    # `crates/kod-provider-anthropic/tests/live.rs` already does this,
    # so the skip is enforced twice and the job is safe to leave
    # enabled on a repo without the secret.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-live-anthropic-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-live-anthropic-
          ${{ runner.os }}-cargo-

    - name: Run live Anthropic tests
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Keep the cost tiny: the tests default to a small model.
        KOD_LIVE_MODEL: claude-3-5-haiku-latest
      run: |
        cargo test -p kod-provider-anthropic --test live -- --ignored --nocapture

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

    - name: Run benchmarks
      run: cargo bench --workspace
