name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# H-C6: cancel a superseded run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Disable any rustc wrapper — see release.yml for the v0.1.13
  # failure this is a guard against.
  RUSTC_WRAPPER: ""
  # H-C6: RUSTFLAGS is scoped to the lint job below. Setting it
  # workflow-wide broke CI on a warning emitted by any *dependency*
  # (a nightly change in a transitive crate is out of our control)
  # and forced a from-scratch rebuild of every `cargo install`ed
  # tool (audit, deny, tarpaulin, bloat).

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      env:
        RUSTFLAGS: "-D warnings"
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    # nextest, not `cargo test`: one process per test. Several tests
    # are irreversibly process-wide (the landlock `apply` tests
    # restrict the whole process; the sandbox/execute-command tests
    # spawn shells inside it). Under `cargo test` — one shared process
    # for every test in a crate — one landlock test poisons all the
    # rest. This is how the suite is developed and run locally, so CI
    # now matches.
    # cargo install, not taiki-e/install-action: the action's Windows
    # install fails with "bash startup failure" (partner-runner-images
    # #169). Slower but works on every runner.
    - name: Install cargo-nextest
      run: cargo install cargo-nextest --locked

    - name: Run tests
      # --no-fail-fast: report every failing test in one run, not just
      # the first. Without it a platform with a long tail of failures
      # (Windows, which had never been green) costs one CI cycle per
      # test.
      run: cargo nextest run --workspace --locked --no-fail-fast

    - name: Run doc tests
      run: cargo test --doc --workspace --locked

  # Fast, deterministic, offline — the two suites that guard the two
  # invariants a refactor is most likely to break silently:
  #
  # - **Provider contracts** (`kod-provider-openai`, `kod-provider-
  #   anthropic`): the wire shape each provider emits for `complete`
  #   and `stream_completion`. The tests use `httpmock` (no network)
  #   and pin multi-role messages, tool calls with ids, tool results
  #   linked by `tool_call_id`, `cache_control` placement on the last
  #   cacheable segment, and `input_schema` vs `parameters`.
  #
  # - **Prompt goldens** (`kod-core`): the byte-level shape of the
  #   prompt the router emits (`characterization_prompts`), the
  #   cacheable prefix's stability across turns (`golden_prefix`), the
  #   `PromptPlan` identity with the text builder (`prompt_plan`), and
  #   the historical transcript rendering (`characterization_history`).
  #
  # Splitting these out of the main `test` job does not remove them
  # from that job; it makes the failure domain legible in the CI UI,
  # which is what §11.4 asks for.
  contracts:
    name: Provider contracts + prompt goldens
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-contracts-
          ${{ runner.os }}-cargo-

    - name: Provider request-shape contracts
      run: |
        cargo test -p kod-provider-openai --test it -- contracts
        cargo test -p kod-provider-anthropic --test it -- contracts

    - name: Prompt characterization + golden prefix + plan
      run: |
        cargo test -p kod-core --test it -- characterization_history
        cargo test -p kod-core --test it -- characterization_prompts
        cargo test -p kod-core --test it -- golden_prefix
        cargo test -p kod-core --test it -- prompt_plan

  msrv:
    name: MSRV (1.98.1)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      with:
        toolchain: "1.98.1"

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-msrv-

    # `cargo check` is enough: MSRV is about the minimum compiler
    # accepting the source, not about the tests passing on it (a
    # dev-only dependency can raise its own MSRV above ours
    # without invalidating the promise).
    - name: Check workspace on MSRV
      run: cargo check --workspace --locked

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run security audit
      run: cargo audit

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Run cargo-deny
      run: cargo deny check

  docs:
    name: Docs (drift + build)
    runs-on: ubuntu-latest

    # The reference pages are the ones a reader trusts to be exhaustive,
    # and they rot silently: `reference/tools.mdx` documented 24 of 31
    # tools and `reference/tui-keys.mdx` listed 49 of 67 slash commands
    # before `scripts/check-docs.sh` existed. That script compares each
    # page against the source that defines it, then builds the site (the
    # only check that the MDX itself is valid). It greps `crates/` with
    # shell tools only, so no Rust toolchain is installed here.
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: "22.12"
        cache: pnpm
        cache-dependency-path: kod-docs/pnpm-lock.yaml

    - name: Install docs dependencies
      working-directory: kod-docs
      run: pnpm install --frozen-lockfile

    - name: Check docs against the code
      run: ./scripts/check-docs.sh

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin --locked

    # Coverage is a *metric*, not a release gate. tarpaulin
    # instruments the test binary, which changes how the subprocesses
    # some integration tests spawn resolve their output — the
    # minimizer and sandbox tests shell out to `sh`/`git` and read the
    # captured stdout, and under tarpaulin that stdout comes back as
    # the harness's own output. They pass in the normal Test job; they
    # fail only here. Skipping them keeps coverage meaningful without
    # weakening the real test gates, and `continue-on-error` keeps a
    # coverage-tooling regression from blocking the build.
    - name: Run coverage
      continue-on-error: true
      run: |
        cargo tarpaulin --workspace --out Xml --output-dir coverage \
          -- --skip minimizer_integration --skip sandbox_containment

    - name: Upload coverage
      continue-on-error: true
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
      with:
        file: coverage/cobertura.xml
        flags: unittests
        name: codecov-umbrella

  # PR-level size gate. The release workflow has a strict 30 MB ceiling
  # on the musl release binary; this lighter check runs on every PR
  # against the debug binary (which is much larger — the point is to
  # catch a runaway dependency add, not to enforce the release
  # promise). A +50 % jump in the debug binary size on a PR is a signal
  # to look at what the diff pulled in; the ceiling leaves room for
  # legitimate growth while catching the pathological case.
  bloat-pr:
    name: Size gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-bloat-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-bloat-

    - name: Build debug binary
      run: cargo build -p kod-cli

    - name: Enforce debug-size ceiling
      run: |
        set -euo pipefail
        BIN=target/debug/kod
        SIZE=$(stat -c%s "$BIN")
        # 200 MiB ceiling. The release binary strips symbols and
        # optimises; debug keeps them. The gate is intentionally
        # generous — the point is to catch a jump, not to police the
        # exact debug size.
        MAX=$((200 * 1024 * 1024))
        echo "debug binary size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MiB)"
        if [ "$SIZE" -gt "$MAX" ]; then
          echo "debug binary exceeds the 200 MiB PR ceiling" >&2
          echo "the diff likely pulled in a heavy dependency; run" >&2
          echo "  cargo bloat -p kod-cli --crates --n 20" >&2
          echo "to see the largest contributors" >&2
          exit 1
        fi

  # Runs the #[ignore]-gated tests that exercise the product against a
  # real OpenAI-compatible server. Without this job, the ignored tests
  # never execute anywhere and a regression in the streaming loop,
  # tool-call assembly, or list_models ships without a signal.
  #
  # Uses the smallest reliable Ollama model (qwen2.5:0.5b, ~350 MB) so
  # pull time stays under a minute on a warm cache. The Ollama setup is
  # the standard installer rather than a marketplace action: the
  # installer is stable, and the actions in that space have had flaky
  # releases.
  live-model:
    name: Live model (Ollama)
    runs-on: ubuntu-latest
    # Skip on PRs from forks that can't install services; run on every
    # push to main/develop and on PRs from the same repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-live-

    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama --version

    - name: Start Ollama
      run: |
        # The systemd unit the installer ships does not run in the
        # Actions sandbox, so start the server directly and wait for
        # /api/tags to answer.
        nohup ollama serve > /tmp/ollama.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf http://localhost:11434/api/tags > /dev/null; then
            echo "Ollama is up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "Ollama did not start within 30s; log follows:" >&2
        cat /tmp/ollama.log >&2
        exit 1

    - name: Pull tiny model
      run: ollama pull qwen2.5:0.5b

    - name: Run live provider tests
      env:
        KOD_TEST_MODEL: qwen2.5:0.5b
      run: cargo test -p kod-provider-openai -- --ignored --nocapture

    - name: Run live TUI round-trip test
      env:
        KOD_TEST_MODEL: qwen2.5:0.5b
        KOD_TEST_DB: /tmp/kod-test.redb
      run: |
        # The TUI's live test needs a kod config pointing at localhost.
        # Write a minimal one into the config directory the CLI reads.
        mkdir -p "$HOME/.config/kod"
        cat > "$HOME/.config/kod/config.toml" <<'CFG'
        [llm]
        provider = "OpenAICompatible"
        model = "qwen2.5:0.5b"
        base_url = "http://localhost:11434"
        context_window = 8192
        max_tokens = 512
        temperature = 0.2
        timeout_secs = 120
        CFG
        # NOTE: the previous --test main_loop target does not exist
        # (all TUI tests are inline #[cfg(test)] modules). Run every
        # ignored test in the crate instead.
        cargo test -p kod-tui -- --ignored --nocapture

  # Live Anthropic API tests (design §4 D1.5). Runs only when the
  # `ANTHROPIC_API_KEY` repository secret is set — a PR from a fork
  # does not have it, so the job is skipped rather than failing. This
  # is the design's "skip, do not fail" shape. Every test in
  # `crates/kod-provider-anthropic/tests/live.rs` re-checks the
  # variable and returns cleanly when it is absent, so the skip is
  # enforced twice: at the job level and at the test level.
  live-anthropic:
    name: Live Anthropic (skippable)
    runs-on: ubuntu-latest
    # H-C5: `secrets` is not available in a job-level `if:`. The
    # pre-fix condition always evaluated false and the job never ran.
    # Gate on the *event* here (push and same-repo PRs only) and let
    # the test itself re-check `ANTHROPIC_API_KEY` — every test in
    # `crates/kod-provider-anthropic/tests/live.rs` already does this,
    # so the skip is enforced twice and the job is safe to leave
    # enabled on a repo without the secret.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-live-anthropic-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-live-anthropic-
          ${{ runner.os }}-cargo-

    - name: Run live Anthropic tests
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Keep the cost tiny: the tests default to a small model.
        KOD_LIVE_MODEL: claude-3-5-haiku-latest
      run: |
        cargo test -p kod-provider-anthropic --test it -- live --ignored --nocapture

  # The two tests that the default suite does not actually exercise:
  #
  # - `kod-lsp` `test_rust_analyzer_did_change_clears_error` runs in
  #   the default `test` job but silently skips when `rust-analyzer`
  #   is not on PATH. Installing the rustup component turns it into a
  #   real assertion, and the `skipping:` grep turns a
  #   present-but-broken toolchain into a failure instead of a silent
  #   pass (L25 — a check that does not halt is not a check).
  #
  # - `kod-mcp` `real_filesystem` is `#[ignore]`d and needs `npx`.
  #   The runner image ships Node LTS, so no install step is needed;
  #   the Verify step exists to fail loudly if that changes.
  #
  # Decision (item #3 of session 18's handoff): the project promises
  # to exercise these on every push to main/develop and every PR from
  # the same repo, and to skip cleanly on a fork PR (the same shape
  # `live-model` and `live-anthropic` already use). Not nightly;
  # every push. If the ~3 min cost becomes a problem, moving this job
  # behind a schedule is a one-line change.
  live-integrations:
    name: Live integrations (rust-analyzer + npx)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      with:
        toolchain: stable
        # rust-analyzer ships with rustup. Without this the LSP test
        # returns early on `binary_on_path` and the whole job passes
        # green on a workspace where LSP is entirely broken.
        components: rust-analyzer

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-live-int-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-live-int-
          ${{ runner.os }}-cargo-

    - name: Verify toolchain
      run: |
        set -euo pipefail
        rust-analyzer --version
        node --version
        npx --version

    # The test asserts on real rust-analyzer diagnostics. If the
    # workspace's LSP path regresses (a `didChange` stops firing, a
    # diagnostic is lost), this fails. If the *toolchain* regresses
    # (rust-analyzer is on PATH but the handshake fails), the test
    # emits a `skipping:` line — grep for it and fail the job
    # explicitly. A silent skip here would be the fail-open shape
    # L25 records.
    - name: LSP live test (rust-analyzer handshake)
      env:
        # The rustup shim for rust-analyzer resolves the toolchain via
        # RUSTUP_TOOLCHAIN, then falls back to `rustup default`. On
        # this runner the default may not be the stable toolchain that
        # `components: rust-analyzer` installed into, producing
        # "Unknown binary 'rust-analyzer' in official toolchain" at
        # spawn time despite `rust-analyzer --version` working.
        # Pinning RUSTUP_TOOLCHAIN to stable makes the shim resolve
        # the toolchain that actually has the component.
        RUSTUP_TOOLCHAIN: stable
      run: |
        set -euo pipefail
        LOG=$(mktemp)
        if ! cargo test -p kod-lsp --lib \
          test_rust_analyzer_did_change_clears_error -- --nocapture >"$LOG" 2>&1; then
          echo "LSP live test failed; full output:" >&2
          cat "$LOG" >&2
          exit 1
        fi
        # Two classes of skip, handled differently:
        #   - "no rust-analyzer on this host" / "handshake failed" /
        #     "could not spawn": the toolchain is broken -> fail the job
        #     (this is the fail-open shape the step exists to catch).
        #   - "diagnostics empty after 5 minutes": rust-analyzer ran
        #     and initialized, but the runner is slower than the test
        #     budget -> warn, don't fail. Blocking a release on a
        #     runner-capacity difference is not what this step is for.
        if grep -qE 'skipping: (rust-analyzer not on PATH|could not spawn|rust-analyzer did not complete)' "$LOG"; then
          echo "rust-analyzer is not usable on this runner:" >&2
          grep 'skipping:' "$LOG" >&2
          exit 1
        fi
        if grep -q 'skipping: diagnostics empty' "$LOG"; then
          echo "WARN: rust-analyzer ran but produced no diagnostics within 5 minutes:" >&2
          grep 'skipping: diagnostics empty' "$LOG" >&2
          echo "LSP live test: rust-analyzer works, this runner is slow (warning only)" >&2
        else
          echo "LSP live test passed with real rust-analyzer"
        fi

    # `--run-ignored=only` runs the `#[ignore]`d real-filesystem
    # tests, not the default suite. npx downloads
    # `@modelcontextprotocol/server-filesystem` on first run; the
    # cache step above keeps it warm across jobs.
    # `cargo test` rather than `cargo nextest run`: this job does not
    # install cargo-nextest (the Test job does, but the install was
    # not replicated here). Before this change the step failed at
    # "error: no such command: nextest" the moment the LSP step above
    # stopped blocking it. `cargo test --ignored` runs the same
    # `#[ignore]`d tests nextest's --run-ignored=only would have
    # selected, and matches the containment step below.
    - name: MCP real-filesystem test (npx @modelcontextprotocol/server-filesystem)
      run: |
        cargo test -p kod-mcp --test it \
          -- --ignored real_filesystem --nocapture

    # `sandbox_containment` is deliberately NOT run in CI.
    #
    # The tests are `#[ignore]`d by design and maintainer-run only.
    # daedfab (2026-10-22) added an Install-bubblewrap step and a
    # step to run them, on the premise that apt-installing bwrap would
    # make them work. Both steps were written blind -- the LSP step
    # failed first every CI run until c8d91f2 (2026-10-23), so the
    # containment step had never actually executed.
    #
    # The first time it ran (5b39ecc6, 2026-10-23), `Install bubblewrap`
    # succeeded and `Sandbox containment tests` failed: bwrap needs
    # unprivileged user namespaces that the GitHub-hosted runner
    # restricts. That is an environment constraint, not a bug in the
    # tests, and it is not fixable by installing a package.
    #
    # Reverted (revert of daedfab, plus this comment). The tests remain
    # #[ignore]`d and maintainer-run -- their state before daedfab
    # touched them. See HANDOFF.md addendum 14 for the full record.

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

    - name: Run benchmarks
      run: cargo bench --workspace

  fuzz-smoke:
    name: Fuzz smoke (5 targets x 30s)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked
    - name: Build fuzz targets
      run: cd fuzz && cargo +nightly fuzz build -s none
    - name: Run each target for 30s
      run: |
        cd fuzz
