name: Regenerate changelog

# Runs when a new version tag is pushed. Regenerates CHANGELOG.md from
# the conventional commits between the previous tag and this one, verifies
# the result against the current file, and opens a PR. Never commits to
# main directly — the PR lets a human review the generated entries.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
        with:
          tool: git-cliff

      - name: Generate new CHANGELOG.md
        run: |
          git-cliff --tag "${{ github.ref_name }}" --output /tmp/CHANGELOG.new
          echo "generated $(wc -l < /tmp/CHANGELOG.new) lines"

      - name: Verify regenerated file
        run: |
          set -e
          NEW=/tmp/CHANGELOG.new
          CUR=CHANGELOG.md

          # Sanity 1: non-empty
          test -s "$NEW" || { echo "::error::generated changelog is empty"; exit 1; }

          # Sanity 2: no corruption string (D7 lesson)
          if grep -qF '(expected empty)' "$NEW"; then
            echo "::error::corruption string found in generated file"
            exit 1
          fi

          # Sanity 3: has the current tag
          if ! grep -qF "${{ github.ref_name }}" "$NEW"; then
            echo "::error::generated file does not mention ${{ github.ref_name }}"
            exit 1
          fi

          # Sanity 4: release count did not decrease
          NEW_COUNT=$(grep -cE '^## \[[0-9]' "$NEW" || true)
          CUR_COUNT=$(grep -cE '^## \[[0-9]' "$CUR" || true)
          echo "current: $CUR_COUNT releases, new: $NEW_COUNT"
          if [ "$NEW_COUNT" -lt "$CUR_COUNT" ]; then
            echo "::error::regenerated changelog has fewer releases than current ($NEW_COUNT < $CUR_COUNT)"
            exit 1
          fi

          # Sanity 5: frontmatter preserved (v0.1.0 still present)
          if ! grep -qF "## [0.1.0]" "$NEW"; then
            echo "::error::v0.1.0 entry disappeared from generated file"
            exit 1
          fi

      - name: Copy verified file into place
        run: cp /tmp/CHANGELOG.new CHANGELOG.md

      - name: Sync site changelog.mdx (preserve frontmatter)
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          mdx_path = Path("kod-docs/src/content/docs/reference/changelog.mdx")
          changelog = Path("CHANGELOG.md").read_text()
          original = mdx_path.read_text()

          m = re.match(r'^(---\n.*?\n---\n)', original, re.DOTALL)
          frontmatter = m.group(1) if m else "---\ntitle: Changelog\n---\n"

          body = re.sub(r'^# Changelog\n+', '', changelog, count=1)
          new_mdx = frontmatter + '\n' + body

          if "(expected empty)" in new_mdx:
              raise SystemExit("corruption in generated mdx")
          if "## [0.1.0]" not in new_mdx:
              raise SystemExit("v0.1.0 missing from generated mdx")

          mdx_path.write_text(new_mdx)
          print(f"changelog.mdx: {len(new_mdx.splitlines())} lines")
          PYEOF

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs: regenerate CHANGELOG.md and changelog.mdx for ${{ github.ref_name }}

            Auto-generated by .github/workflows/changelog.yml from the
            conventional commits between the previous tag and
            ${{ github.ref_name }}. Both files verified against the current
            contents before being written.
          branch: changelog/${{ github.ref_name }}
          delete-branch: true
          title: "docs: regenerate changelog for ${{ github.ref_name }}"
          body: |
            Automated changelog regeneration for `${{ github.ref_name }}`.

            **Files updated:**
            - `CHANGELOG.md` — regenerated from conventional commits via `git-cliff`
            - `kod-docs/src/content/docs/reference/changelog.mdx` — synced, frontmatter preserved

            **Verified before writing:**
            - non-empty output
            - no corruption strings
            - contains the new tag
            - release count did not decrease
            - v0.1.0 entry preserved

            Review the generated entries and merge if they read correctly.
            If a commit's category is wrong, edit `cliff.toml` and re-push the tag.
          labels: |
            documentation
            automated
