name: Regenerate changelog

# Runs when a new version tag is pushed. Generates ONLY the newest
# release's section from git-cliff --unreleased, verifies it, and
# PREPENDS it to CHANGELOG.md. Existing (hand-curated + previously
# generated) entries are preserved verbatim.
#
# Why --unreleased and manual prepend, not --tag:
# `git-cliff --tag vX.Y.Z` regenerates the ENTIRE file. Current entries
# v0.1.0-v0.1.27 are either hand-curated or were generated by an earlier
# one-shot recovery script — they should not be replaced by a fresh run
# with a different formatting template. Only the new section is added.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
        with:
          tool: git-cliff

      - name: Generate new section only
        id: changelog
        run: |
          # --unreleased generates commits since the last tag, named under
          # the new tag. --strip header drops the file-level header so we
          # can insert only the release body.
          git-cliff --unreleased \
                    --tag "${{ github.ref_name }}" \
                    --strip header \
                    --output /tmp/new_section.md
          echo "generated $(wc -l < /tmp/new_section.md) lines"

          # A tag push whose only commits since the previous tag are
          # `chore(release):` or `chore(deps):` produces a section with
          # the release header but zero bullets. Gate the rest of the
          # workflow on bullet count, not line count.
          BULLETS=$(grep -cE '^- ' /tmp/new_section.md || echo 0)
          if [ "$BULLETS" -eq 0 ]; then
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No user-visible commits since previous tag; skipping changelog PR"
          else
            echo "has_content=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$BULLETS changelog entries found"
          fi

      - name: Verify new section
        if: steps.changelog.outputs.has_content == 'true'
        run: |
          set -e
          NEW=/tmp/new_section.md
          CUR=CHANGELOG.md

          # Sanity 1: non-empty
          test -s "$NEW" || { echo "::error::new section is empty — no conventional commits since last tag?"; exit 1; }

          # Sanity 2: no corruption string
          if grep -qF '(expected empty)' "$NEW"; then
            echo "::error::corruption string in generated section"
            exit 1
          fi

          # Sanity 3: mentions the new tag
          if ! grep -qF "## [${{ github.ref_name }}]" "$NEW"; then
            # --tag vX.Y.Z renders as ## [X.Y.Z], so check without v prefix
            TAG_NUM="${{ github.ref_name }}"
            TAG_NUM="${TAG_NUM#v}"
            if ! grep -qF "## [${TAG_NUM}]" "$NEW"; then
              echo "::error::generated section does not name the new tag"
              exit 1
            fi
          fi

          # Sanity 4: no ## [0.1.x] headers OLDER than the new tag
          # (i.e. --unreleased is behaving as expected, not regenerating)
          OLD_COUNT=$(grep -cE '^## \[0\.1\.' "$NEW" || echo 0)
          if [ "$OLD_COUNT" -gt 1 ]; then
            echo "::error::--unreleased is not working as expected (found $OLD_COUNT old release headers)"
            grep -E '^## \[0\.1\.' "$NEW" | head -5
            exit 1
          fi

      - name: Prepend new section to CHANGELOG.md
        if: steps.changelog.outputs.has_content == 'true'
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          current = Path("CHANGELOG.md").read_text()
          new_section = Path("/tmp/new_section.md").read_text()

          # Find where the first "## [X.Y.Z]" appears — that's where
          # existing releases start. Insert new_section just before it.
          m = re.search(r'^## \[[0-9]', current, re.M)
          if not m:
              # No existing releases — append at end
              result = current.rstrip() + "\n\n" + new_section.strip() + "\n"
          else:
              before = current[:m.start()].rstrip()
              after = current[m.start():]
              result = before + "\n\n" + new_section.strip() + "\n\n" + after

          if "(expected empty)" in result:
              raise SystemExit("corruption in assembled changelog")
          if not result.strip():
              raise SystemExit("assembled changelog is empty")

          Path("CHANGELOG.md").write_text(result)
          print(f"CHANGELOG.md: {len(result.splitlines())} lines")
          PYEOF

      - name: Sync site changelog.mdx (preserve frontmatter)
        if: steps.changelog.outputs.has_content == 'true'
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          mdx_path = Path("kod-docs/src/content/docs/reference/changelog.mdx")
          changelog = Path("CHANGELOG.md").read_text()
          original = mdx_path.read_text()

          m = re.match(r'^(---\n.*?\n---\n)', original, re.DOTALL)
          frontmatter = m.group(1) if m else "---\ntitle: Changelog\n---\n"

          body = re.sub(r'^# Changelog\n+', '', changelog, count=1)
          new_mdx = frontmatter + '\n' + body

          if "(expected empty)" in new_mdx:
              raise SystemExit("corruption in generated mdx")

          mdx_path.write_text(new_mdx)
          print(f"changelog.mdx: {len(new_mdx.splitlines())} lines")
          PYEOF

      - name: Create pull request
        if: steps.changelog.outputs.has_content == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs: add ${{ github.ref_name }} to CHANGELOG.md

            Generated from conventional commits since the previous tag via
            git-cliff --unreleased. Only the new release section is added —
            all existing entries are preserved verbatim.
          branch: changelog/${{ github.ref_name }}
          delete-branch: true
          title: "docs: changelog entry for ${{ github.ref_name }}"
          body: |
            Automated changelog entry for `${{ github.ref_name }}`.

            **What this adds:** just the new release section, generated via
            `git-cliff --unreleased`. Existing entries (v0.1.0 through the
            previous tag) are untouched.

            **Sanity gates before write:**
            - non-empty output
            - no `(expected empty)` corruption
            - contains the new tag
            - does NOT contain multiple historical `## [0.1.x]` headers
              (confirms `--unreleased` behaved correctly)

            If the generated entry's categories look wrong, edit `cliff.toml`
            and re-push the tag (delete + re-create works: `git push --delete
            origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }}`).
          labels: |
            documentation
            automated
