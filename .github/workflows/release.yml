name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validation only (no publish, no release)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: elcoosp/docs-toolkit/.github/workflows/rust-release.yml@main
    with:
      publish: true
      binary_targets: '["x86_64-unknown-linux-gnu","aarch64-apple-darwin"]'
      extra_checks: '["verify-tag","fmt","clippy","test"]'
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
