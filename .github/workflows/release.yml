# Release + changelog — calls the canonical reusable workflow.
# Copy to .github/workflows/release.yml in every fleet repo.
#
# The reusable workflow lives at:
#   elcoosp/docs-toolkit/.github/workflows/changelog.yml@main
#
# It uses the canonical cliff.toml at:
#   docs-toolkit/git-cliff/cliff.toml
#
# No cliff.toml is stored in this repo — config is fetched at runtime.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    uses: elcoosp/docs-toolkit/.github/workflows/changelog.yml@main
    with:
      mode: release
    secrets: inherit
