# Drop-in .github/workflows/release-plz.yml for every repo.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print plan without opening PR / releasing'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: elcoosp/docs-toolkit/.github/workflows/release-plz.yml@main
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
