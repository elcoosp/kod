[package]
name = "kod-core"
description = "Core engine coordinating all KOD subsystems."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

keywords = ["ai-agent", "llm", "coding-agent", "engine", "async"]
categories = ["development-tools", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }
async-stream = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
async-trait = { workspace = true }
futures = { workspace = true }
kod-core-state = { path = "../kod-core-state", version = "0.1.27" }
kod-core-routing = { path = "../kod-core-routing", version = "0.1.27" }
kod-core-quality = { path = "../kod-core-quality", version = "0.1.27" }
kod-core-tools = { path = "../kod-core-tools", version = "0.1.27" }
kod-types = { path = "../kod-types", version = "0.1.27" }
kod-error = { path = "../kod-error", version = "0.1.27" }
kod-stats = { path = "../kod-stats", version = "0.1.27" }
kod-telemetry = { path = "../kod-telemetry", version = "0.1.27" }
kod-risk = { path = "../kod-risk", version = "0.1.27" }
kod-schema-dialect = { path = "../kod-schema-dialect", version = "0.1.27" }
kod-config = { path = "../kod-config", version = "0.1.27" }
regex = { workspace = true }
ignore = { workspace = true }
kod-provider = { path = "../kod-provider", version = "0.1.27" }
kod-provider-openai = { path = "../kod-provider-openai", version = "0.1.27" }
kod-provider-anthropic = { path = "../kod-provider-anthropic", version = "0.1.27" }
kod-skills = { path = "../kod-skills", version = "0.1.27" }
kod-memory = { path = "../kod-memory", version = "0.1.27" }
kod-tools = { path = "../kod-tools", version = "0.1.27" }
kod-ast = { path = "../kod-ast", version = "0.1.27" }
kod-lsp = { path = "../kod-lsp", version = "0.1.27" }
kod-mcp = { path = "../kod-mcp", version = "0.1.27" }
kod-swarm = { path = "../kod-swarm", version = "0.1.27" }

time = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }
typesafe-ai-rs = { workspace = true }
# Criterion benchmarks. `harness = false` is REQUIRED: without it
# rustc's built-in test harness runs instead of `criterion_main!`,
# finds zero `#[bench]`-annotated functions, and prints
# "running 0 tests" — the benches in `benches/system_benchmarks.rs`
# are never reached. This block was missing; `cargo bench` on this
# crate had been a no-op.
[[bench]]
name = "system_benchmarks"
harness = false

[dev-dependencies]
httpmock = { workspace = true }
kod-provider-openai = { path = "../kod-provider-openai", version = "0.1.27" }
kod-core-serve = { path = "../kod-core-serve", version = "0.1.27" }
serial_test = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
kod-swarm = { path = "../kod-swarm", version = "0.1.27" }
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
kod-provider = { path = "../kod-provider", version = "0.1.27" }
kod-types = { path = "../kod-types", version = "0.1.27" }

[lints]
workspace = true

[[bench]]
name = "action_benchmarks"
harness = false
