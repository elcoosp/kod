[package]
name = "kod-core-state"
description = "Persistent state, journals, ledgers, and cost accounting for KOD."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

keywords = ["state", "session", "journal", "ai-agent", "llm"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
parking_lot = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
kod-types = { path = "../kod-types", version = "0.1.27" }
kod-error = { path = "../kod-error", version = "0.1.27" }

dirs = { workspace = true }
regex = { workspace = true }
kod-config = { path = "../kod-config", version = "0.1.27" }
kod-provider = { path = "../kod-provider", version = "0.1.27" }
kod-tools = { path = "../kod-tools", version = "0.1.27" }
[dev-dependencies]
filetime = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
rstest = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
