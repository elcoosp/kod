[package]
name = "kod-core-tools"
description = "Adapter layer wrapping KOD's built-in tools for the engine."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

keywords = ["tools", "ai-agent", "execution", "async", "llm"]
categories = ["development-tools", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
parking_lot = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
kod-types = { path = "../kod-types", version = "0.1.27" }
kod-error = { path = "../kod-error", version = "0.1.27" }
kod-config = { path = "../kod-config", version = "0.1.27" }
kod-provider = { path = "../kod-provider", version = "0.1.27" }
kod-memory = { path = "../kod-memory", version = "0.1.27" }
kod-tools = { path = "../kod-tools", version = "0.1.27" }
kod-lsp = { path = "../kod-lsp", version = "0.1.27" }
kod-mcp = { path = "../kod-mcp", version = "0.1.27" }
kod-swarm = { path = "../kod-swarm", version = "0.1.27" }
kod-skills = { path = "../kod-skills", version = "0.1.27" }
kod-risk = { path = "../kod-risk", version = "0.1.27" }
kod-core-state = { path = "../kod-core-state", version = "0.1.27" }
kod-core-routing = { path = "../kod-core-routing", version = "0.1.27" }
kod-core-quality = { path = "../kod-core-quality", version = "0.1.27" }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
