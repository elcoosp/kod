[package]
name = "kod-tui"
description = "Terminal user interface for KOD."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

keywords = ["tui", "terminal", "ratatui", "ai-agent", "llm"]
categories = ["command-line-utilities", "command-line-interface"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { workspace = true }
kod-core-tools = { path = "../kod-core-tools", version = "0.1.28" }
kod-core-quality = { path = "../kod-core-quality", version = "0.1.28" }
kod-core-routing = { path = "../kod-core-routing", version = "0.1.28" }
kod-core-state = { path = "../kod-core-state", version = "0.1.28" }
unicode-width = { workspace = true }
kod-provider = { path = "../kod-provider", version = "0.1.28" }
ratatui = { workspace = true }
crossterm = { workspace = true }
syntect = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
kod-types = { path = "../kod-types", version = "0.1.28" }
kod-error = { path = "../kod-error", version = "0.1.28" }
kod-config = { path = "../kod-config", version = "0.1.28" }
kod-core = { path = "../kod-core", version = "0.1.28" }
kod-skills = { path = "../kod-skills", version = "0.1.28" }
kod-provider-openai = { path = "../kod-provider-openai", version = "0.1.28" }
kod-tools = { path = "../kod-tools", version = "0.1.28" }
kod-memory = { path = "../kod-memory", version = "0.1.28" }
walkdir = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serial_test = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
