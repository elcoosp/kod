[package]
documentation = "https://kod.vercel.app"

name = "kod-swarm"
description = "Coordinated multi-agent swarm collaboration for KOD."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

keywords = ["ai", "swarm", "llm", "coding-agent", "agents"]
categories = ["development-tools", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }
futures = { workspace = true }
kod-types = { path = "../kod-types", version = "0.1.29" }
kod-error = { path = "../kod-error", version = "0.1.29" }
kod-config = { path = "../kod-config", version = "0.1.29" }
kod-memory = { path = "../kod-memory", version = "0.1.29" }
kod-tools = { path = "../kod-tools", version = "0.1.29" }
kod-provider = { path = "../kod-provider", version = "0.1.29" }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
