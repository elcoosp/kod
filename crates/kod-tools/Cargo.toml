[package]
name = "kod-tools"
description = "Tool system for agent-environment interaction in KOD."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

keywords = ["ai", "tools", "llm", "coding-agent", "function-calling"]
categories = ["development-tools", "command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
fs4 = { workspace = true }
libc = { workspace = true }
similar = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
kod-config = { path = "../kod-config", version = "0.1.28" }
kod-minimize = { path = "../kod-minimize", version = "0.1.28" }
kod-types = { path = "../kod-types", version = "0.1.28" }
kod-error = { path = "../kod-error", version = "0.1.28" }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
