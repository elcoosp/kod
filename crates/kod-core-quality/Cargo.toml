[package]
name = "kod-core-quality"
description = "Codebase analysis, cleanup, and quality gates for KOD."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

keywords = ["quality", "analysis", "ai-agent", "lint", "code"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
parking_lot = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
kod-types = { path = "../kod-types", version = "0.1.27" }
kod-error = { path = "../kod-error", version = "0.1.27" }
kod-ast = { path = "../kod-ast", version = "0.1.27" }
kod-tools = { path = "../kod-tools", version = "0.1.27" }
kod-provider = { path = "../kod-provider", version = "0.1.27" }
kod-core-state = { path = "../kod-core-state", version = "0.1.27" }
kod-core-routing = { path = "../kod-core-routing", version = "0.1.27" }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
