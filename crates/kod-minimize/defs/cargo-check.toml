schema_version = 1
id = "cargo-check"
program = "cargo"
subcommands = ["check"]

# Cargo's check output is a block per diagnostic: `error[E...]:` or
# `warning:`, then a `--> path:line:col`, then the source snippet,
# then an optional `note:`. Keeping the error/warning header, the
# location, and the note is the actionable set — the snippet lines
# are guesswork for a model that can read the file itself.
stages = [
    { kind = "strip_ansi" },
    { kind = "keep_lines", patterns = [
        "^error",
        "^warning",
        "^  --> ",
        "^note:",
        "^  = note:",
        "^  = help:",
    ] },
    { kind = "max_lines", n = 60 },
]

[[tests]]
name = "keeps_errors_and_locations"
raw = """
   Compiling my-crate v0.1.0
error[E0308]: mismatched types
 --> src/main.rs:5:5
  |
5 |     let x: i32 = "hello";
  |            ^^^ expected `i32`, found `&str`
  |
  = note: expected type `i32`
warning: unused variable: `y`
 --> src/main.rs:8:9
  |
8 |     let y = 5;
  |

error: could not compile `my-crate` (bin "my-crate") due to 1 previous error
"""

[[tests.checks]]
kind = "contains"
value = "error[E0308]"

[[tests.checks]]
kind = "contains"
value = "--> src/main.rs:5:5"

[[tests.checks]]
kind = "contains"
value = "warning: unused variable"

[[tests.checks]]
kind = "not_contains"
value = "Compiling my-crate"
