schema_version = 1
id = "git-status"
program = "git"
subcommands = ["status"]
only_on_exit = 0

stages = [
    { kind = "strip_ansi" },
    { kind = "max_lines", n = 40 },
]

[[tests]]
name = "branch_and_count"
raw = """
On branch main
Your branch is up to date with 'origin/main'.

Changes not staged for commit:
  (use "git add <file>..." to update what will be committed)
  (use "git restore <file>..." to discard changes in working directory)
	modified:   src/lib.rs
	modified:   src/main.rs

Untracked files:
  (use "git add <file>..." to include in what will be committed)
	new_file.rs

no changes added to commit (use "git add" and/or "git commit -a")
"""

[[tests.checks]]
kind = "contains"
value = "On branch main"

[[tests.checks]]
kind = "contains"
value = "modified:"

[[tests.checks]]
kind = "not_contains"
value = "use \"git add <file>"

[[tests.checks]]
kind = "max_lines"
value = "10"
