[package]
name = "kod-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true }
async-trait = "0.1"
parking_lot = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
kod-types = { path = "../kod-types" }
kod-provider = { path = "../kod-provider" }
kod-error = { path = "../kod-error" }
# `embedding::from_config` reads `MemoryConfig` / `EmbeddingEndpoint`
# to build the embedder the runtime installs. Foundation → foundation,
# no cycle: kod-config depends only on kod-error.
kod-config = { path = "../kod-config" }

[dev-dependencies]
tempfile = "3.8"
rstest = { workspace = true }
