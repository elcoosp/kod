[package]
name = "kod-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
futures = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
parking_lot = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
kod-types = { path = "../kod-types" }
kod-provider = { path = "../kod-provider" }
kod-error = { path = "../kod-error" }
# `embedding::from_config` reads `MemoryConfig` / `EmbeddingEndpoint`
# to build the embedder the runtime installs. Foundation → foundation,
# no cycle: kod-config depends only on kod-error.
kod-config = { path = "../kod-config" }

[dev-dependencies]
proptest = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
