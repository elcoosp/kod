[package]
name = "kod-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
kod-types = { path = "../kod-types" }
kod-error = { path = "../kod-error" }
kod-config = { path = "../kod-config" }
kod-core = { path = "../kod-core" }
kod-skills = { path = "../kod-skills" }
kod-memory = { path = "../kod-memory" }
kod-provider = { path = "../kod-provider" }
kod-provider-openai = { path = "../kod-provider-openai" }
kod-tools = { path = "../kod-tools" }
kod-tui = { path = "../kod-tui" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
dirs.workspace = true
chrono = { workspace = true }
reqwest = { workspace = true }
walkdir = { workspace = true }
similar = { workspace = true }
ignore = { workspace = true }

globset = { workspace = true }
toml = { workspace = true }
[dev-dependencies]
portable-pty = "0.8"
# E2E TUI testing through a PTY (terminal-testlib is the renamed
# successor of ratatui-testlib; the rename landed on `main` but has
# not yet been published to crates.io, so a git dep is required).
terminal-testlib = { git = "https://github.com/raibid-labs/ratatui-testlib", branch = "main" }
# Mock LLM server for the E2E tests — serves an OpenAI-compatible
# /v1/chat/completions SSE stream from a loopback port.
axum = "0.8"
tempfile = "3.8"
kod-config = { path = "../kod-config" }
toml = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
kod-provider = { path = "../kod-provider" }
kod-types = { path = "../kod-types" }

[build-dependencies]
chrono = { workspace = true }

[[bin]]
name = "kod"
path = "src/main.rs"

[lints]
workspace = true
