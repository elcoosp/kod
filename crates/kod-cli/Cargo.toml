[package]
name = "kod-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
serde = { workspace = true }
clap = { workspace = true }
kod-types = { path = "../kod-types" }
kod-error = { path = "../kod-error" }
kod-config = { path = "../kod-config" }
kod-core = { path = "../kod-core" }
kod-skills = { path = "../kod-skills" }
kod-memory = { path = "../kod-memory" }
kod-provider = { path = "../kod-provider" }
kod-provider-openai = { path = "../kod-provider-openai" }
kod-tui = { path = "../kod-tui" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
dirs.workspace = true

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.8"
kod-config = { path = "../kod-config" }
toml = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

[[bin]]
name = "kod"
path = "src/main.rs"
