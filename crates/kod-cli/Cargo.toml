[package]
name = "kod-cli"
description = "Command-line interface for the KOD terminal-native AI coding agent."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
build = "build.rs"

keywords = ["cli", "ai-agent", "coding-agent", "terminal", "llm"]
categories = ["command-line-utilities", "command-line-interface"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { workspace = true }
kod-core-tools = { path = "../kod-core-tools", version = "0.1.27" }
kod-core-quality = { path = "../kod-core-quality", version = "0.1.27" }
kod-core-routing = { path = "../kod-core-routing", version = "0.1.27" }
kod-core-state = { path = "../kod-core-state", version = "0.1.27" }
libc = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
kod-types = { path = "../kod-types", version = "0.1.27" }
kod-error = { path = "../kod-error", version = "0.1.27" }
kod-config = { path = "../kod-config", version = "0.1.27" }
kod-core = { path = "../kod-core", version = "0.1.27" }
kod-core-serve = { path = "../kod-core-serve", version = "0.1.27" }
kod-skills = { path = "../kod-skills", version = "0.1.27" }
kod-memory = { path = "../kod-memory", version = "0.1.27" }
kod-provider = { path = "../kod-provider", version = "0.1.27" }
kod-provider-openai = { path = "../kod-provider-openai", version = "0.1.27" }
kod-tools = { path = "../kod-tools", version = "0.1.27" }
kod-tui = { path = "../kod-tui", version = "0.1.27" }
kod-stats = { path = "../kod-stats", version = "0.1.27" }
kod-telemetry = { path = "../kod-telemetry", version = "0.1.27" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
dirs.workspace = true
chrono = { workspace = true }
reqwest = { workspace = true }
walkdir = { workspace = true }
similar = { workspace = true }
ignore = { workspace = true }

globset = { workspace = true }
toml = { workspace = true }
[dev-dependencies]
proptest = { workspace = true }
serial_test = { workspace = true }
portable-pty = { workspace = true }
# E2E TUI testing through a PTY (terminal-testlib is the renamed
# successor of ratatui-testlib; the rename landed on `main` but has
# not yet been published to crates.io, so a git dep is required).
terminal-testlib = { git = "https://github.com/raibid-labs/ratatui-testlib", rev = "9e85657724f6b5edaa7a87af057f7a59c4655bb5" }
# Mock LLM server for the E2E tests — serves an OpenAI-compatible
# /v1/chat/completions SSE stream from a loopback port.
axum = { workspace = true }
tempfile = { workspace = true }
kod-config = { path = "../kod-config", version = "0.1.27" }
toml = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
kod-provider = { path = "../kod-provider", version = "0.1.27" }
kod-types = { path = "../kod-types", version = "0.1.27" }

[build-dependencies]
chrono = { workspace = true }

[[bin]]
name = "kod"
path = "src/main.rs"

[lints]
workspace = true
