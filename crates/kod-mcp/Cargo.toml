[package]
name = "kod-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Delta §7.7: cache `tools/list` keyed by a SHA-256 of the server spec.
sha2 = { workspace = true }
# Cross-platform cache dir (`~/.cache/kod/mcp` on Linux,
# `~/Library/Caches/kod/mcp` on macOS).
dirs = { workspace = true }
url = "2"

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3.8"
# The two `real_filesystem` tests each spawn their own
# `npx @modelcontextprotocol/server-filesystem`. libtest runs them
# concurrently, and two simultaneous npx invocations share one npm
# cache -- the loser's server died at `initialize` with "server
# terminated" on CI. Serialise them.
serial_test = { workspace = true }

[lints]
workspace = true
