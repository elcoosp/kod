[package]
name = "kod-provider-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
adk-core = "2.2"
# `default-features = false`: adk-model's default feature is `gemini`,
# which kod-provider-openai does not use. Without this, every build
# compiles adk-gemini and pulls reqwest 0.12 into the graph twice.
adk-model = { version = "2.2", default-features = false, features = ["openai"] }
kod-types = { path = "../kod-types" }
kod-error = { path = "../kod-error" }
kod-provider = { path = "../kod-provider" }
kod-config = { path = "../kod-config" }

[dev-dependencies]
kod-provider = { path = "../kod-provider", features = ["testkit"] }
time = { workspace = true }
httpmock = "0.7"
tempfile = "3.8"

[lints]
workspace = true
