[package]
name = "kod-provider-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
adk-core = { workspace = true }
# `default-features = false`: adk-model's default feature is `gemini`,
# which kod-provider-openai does not use. Without this, every build
# compiles adk-gemini and pulls reqwest 0.12 into the graph twice.
adk-model = { workspace = true, features = ["openai"] }
kod-types = { path = "../kod-types" }
kod-error = { path = "../kod-error" }
kod-provider = { path = "../kod-provider" }
kod-config = { path = "../kod-config" }

[dev-dependencies]
proptest = { workspace = true }
kod-provider = { path = "../kod-provider", features = ["testkit"] }
time = { workspace = true }
httpmock = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
