[package]
documentation = "https://kod.vercel.app"

name = "kod-core-serve"
description = "Unix-socket daemon and ACP bridge for KOD."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

keywords = ["ai", "serve", "llm", "coding-agent", "server"]
categories = ["development-tools", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
kod-error = { path = "../kod-error", version = "0.1.29" }
kod-provider = { path = "../kod-provider", version = "0.1.29" }
kod-types = { path = "../kod-types", version = "0.1.29" }
kod-core = { path = "../kod-core", version = "0.1.29" }
kod-core-state = { path = "../kod-core-state", version = "0.1.29" }

[dev-dependencies]
proptest = { workspace = true }
async-trait = { workspace = true }
kod-config = { path = "../kod-config", version = "0.1.29" }
kod-error = { path = "../kod-error", version = "0.1.29" }
kod-provider = { path = "../kod-provider", version = "0.1.29" }
kod-types = { path = "../kod-types", version = "0.1.29" }
futures = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
