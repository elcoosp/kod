[package]
name = "kod-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
kod-types = { path = "../kod-types" }
kod-error = { path = "../kod-error" }
time = { workspace = true }

[dev-dependencies]
httpmock = "0.7"
time = { workspace = true }

[features]
# Exposes `kod_provider::testkit`, the shared provider contract
# suite (§11.2). Enabled by each concrete provider crate's
# dev-dependencies so a test binary can call the suite against its
# own `LlmProvider` implementation.
#
# No `dep:` entries: `tokio`, `serde_json`, and the rest are
# unconditional dependencies of this crate. A feature that names
# them would either be a no-op (`dep:foo` on a non-optional dep is
# an error) or force them to become optional and break every other
# feature that relies on them.
testkit = []
