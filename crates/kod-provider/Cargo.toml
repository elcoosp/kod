[package]
name = "kod-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
kod-types = { path = "../kod-types" }
kod-error = { path = "../kod-error" }

[dev-dependencies]
httpmock = "0.7"
time = { workspace = true }

[features]
# Exposes `kod_provider::testkit`, the shared provider contract
# suite (§11.2). Enabled by each concrete provider crate's
# dev-dependencies so a test binary can call the suite against its
# own `LlmProvider` implementation.
testkit = ["dep:tokio", "dep:serde_json"]
