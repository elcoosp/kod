[package]
name = "kod-provider"
description = "LLM provider abstraction layer for KOD."
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

keywords = ["llm", "provider", "traits", "ai-agent", "async"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
kod-types = { path = "../kod-types", version = "0.1.27" }
kod-error = { path = "../kod-error", version = "0.1.27" }
time = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
httpmock = { workspace = true }
time = { workspace = true }

[features]
# `testkit` is on by default so the contract suite in
# `src/testkit.rs` is compiled (and its own test module runs) during
# a plain `cargo nextest --workspace`. Without this, the module is
# excluded from every default test build and its 278 lines are
# measured as 0% covered — which is what the coverage report used to
# show.
#
# Downstream crates that want the suite import it explicitly; the
# rest pay only for the code being present, not for it being used.
default = ["testkit"]
testkit = []

[lints]
workspace = true
