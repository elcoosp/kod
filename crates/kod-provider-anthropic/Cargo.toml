[package]
name = "kod-provider-anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
async-stream = { workspace = true }
adk-core = { workspace = true }
# `default-features = false`: adk-model's default feature is `gemini`,
# which kod-provider-anthropic does not use. See the sibling note in
# kod-provider-openai.
adk-model = { workspace = true, features = ["anthropic"] }
kod-types = { path = "../kod-types" }
kod-error = { path = "../kod-error" }
kod-provider = { path = "../kod-provider" }
kod-config = { path = "../kod-config" }

[dev-dependencies]
kod-provider = { path = "../kod-provider", features = ["testkit"] }
proptest = { workspace = true }
time = { workspace = true }
httpmock = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
